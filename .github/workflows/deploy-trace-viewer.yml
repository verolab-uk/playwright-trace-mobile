name: Deploy trace viewer runtime

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-trace-viewer.yml'
      - 'packages/trace-viewer/**'
      - 'packages/playwright-core/src/**'
      - 'packages/protocol/**'
      - 'packages/isomorphic/**'
      - 'packages/trace/**'
      - 'packages/web/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-trace-viewer-runtime
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and publish runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build trace viewer app
        working-directory: packages/trace-viewer
        run: npx vite build --config vite.config.ts

      - name: Build trace viewer service worker
        working-directory: packages/trace-viewer
        run: npx vite build --config vite.sw.config.ts

      - name: Package runtime
        run: |
          set -euo pipefail
          mkdir -p public
          cd packages/playwright-core/lib/vite/traceViewer
          tar -czf "$GITHUB_WORKSPACE/public/trace-viewer.tar.gz" .
          cp -R . "$GITHUB_WORKSPACE/public/viewer"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: trace-viewer-runtime
          path: public
          if-no-files-found: error

      - name: Publish public runtime repository
        env:
          RUNTIME_DEPLOY_TOKEN: ${{ secrets.RUNTIME_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${RUNTIME_DEPLOY_TOKEN}" ]]; then
            echo "RUNTIME_DEPLOY_TOKEN is required to publish verolab-uk/playwright-trace-mobile-runtime" >&2
            exit 1
          fi
          git clone "https://x-access-token:${RUNTIME_DEPLOY_TOKEN}@github.com/verolab-uk/playwright-trace-mobile-runtime.git" "$RUNNER_TEMP/playwright-trace-mobile-runtime"
          rm -rf "$RUNNER_TEMP/playwright-trace-mobile-runtime"/*
          cp -R public/. "$RUNNER_TEMP/playwright-trace-mobile-runtime/"
          cd "$RUNNER_TEMP/playwright-trace-mobile-runtime"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "Runtime repository already up to date."
            exit 0
          fi
          git commit -m "Publish trace viewer runtime ${GITHUB_SHA}"
          git push origin main
