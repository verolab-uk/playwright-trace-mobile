name: Deploy trace viewer runtime

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-trace-viewer.yml'
      - 'packages/trace-viewer/**'
      - 'packages/playwright-core/src/**'
      - 'packages/protocol/**'
      - 'packages/isomorphic/**'
      - 'packages/trace/**'
      - 'packages/web/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-trace-viewer-runtime
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and publish runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build trace viewer app
        working-directory: packages/trace-viewer
        run: npx vite build --config vite.config.ts

      - name: Build trace viewer service worker
        working-directory: packages/trace-viewer
        run: npx vite build --config vite.sw.config.ts

      - name: Package runtime
        run: |
          set -euo pipefail
          mkdir -p public
          cd packages/playwright-core/lib/vite/traceViewer
          tar -czf "$GITHUB_WORKSPACE/public/trace-viewer.tar.gz" .
          cp -R . "$GITHUB_WORKSPACE/public/viewer"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: trace-viewer-runtime
          path: public
          if-no-files-found: error

      - name: Deploy to Cloudflare Pages
        if: ${{ vars.CLOUDFLARE_PAGES_PROJECT != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main
