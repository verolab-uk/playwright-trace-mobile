name: Compact traces action

on:
  push:
    paths:
      - '.github/actions/compact-traces/**'
      - '.github/workflows/compact-traces.yml'
  pull_request:
    paths:
      - '.github/actions/compact-traces/**'
      - '.github/workflows/compact-traces.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .github/actions/compact-traces
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Unit tests
        run: bun run test
      - name: Run the action on an empty directory
        uses: ./.github/actions/compact-traces
        with:
          paths: does-not-exist
