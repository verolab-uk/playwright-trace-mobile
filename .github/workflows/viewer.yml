name: Trace viewer

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test

      # The preview opens the trace recorded by the tests in the built viewer.
      - name: Assemble preview
        run: |
          set -euo pipefail
          mkdir -p preview/viewer/traces
          cp -R dist/. preview/viewer/
          cp tests/.traces/sample.zip preview/viewer/traces/
          echo '<meta http-equiv="refresh" content="0; url=viewer/index.html?trace=traces/sample.zip">' > preview/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: preview
          path: preview
          if-no-files-found: error

  # Each branch gets its own Cloudflare Pages preview URL.
  preview:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: preview
          path: preview
      - id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy preview --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=${{ github.ref_name }}
      - name: Show preview link
        env:
          URL: ${{ steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url }}
        run: echo "Preview -> $URL" >> "$GITHUB_STEP_SUMMARY"
