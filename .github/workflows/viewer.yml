name: Trace viewer

on:
  push:
    branches-ignore:
      - ci-screenshots
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: error

  # Stores the screenshots on the ci-screenshots branch and shows them on the
  # branch's open PR, so each push can be checked by eye.
  screenshots:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: ci-screenshots
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: screenshots
          path: ${{ runner.temp }}/screenshots
      - name: Store screenshots
        run: |
          set -euo pipefail
          if git fetch --quiet --depth 1 origin ci-screenshots; then
            git switch --quiet -C ci-screenshots FETCH_HEAD
          else
            git switch --quiet --orphan ci-screenshots
          fi
          mkdir -p "$GITHUB_SHA"
          cp "$RUNNER_TEMP"/screenshots/*.png "$GITHUB_SHA"/
          git add "$GITHUB_SHA"
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit --quiet -m "Screenshots for $GITHUB_SHA"
          git push --quiet origin ci-screenshots
      - name: Show screenshots
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/$GH_REPO/ci-screenshots/$GITHUB_SHA"
          marker='<!-- viewer-screenshots -->'
          body="$marker
          Trace viewer at $GITHUB_SHA, phone portrait and landscape:

          <img src=\"$base/portrait.png\" width=\"260\"> <img src=\"$base/landscape.png\" width=\"560\">"
          printf '%s\n' "$body" >> "$GITHUB_STEP_SUMMARY"

          pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          [[ -n "$pr" ]] || exit 0
          comment=$(gh api "repos/$GH_REPO/issues/$pr/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n 1)
          if [[ -n "$comment" ]]; then
            gh api -X PATCH "repos/$GH_REPO/issues/comments/$comment" -f body="$body" > /dev/null
          else
            gh pr comment "$pr" --body "$body"
          fi
